name: "mcp-trust-check"
description: "Runs mcp-doctor, mcp-fuzz, and mcp-reality-check against an MCP server and posts one combined trust score."
author: "Vishal Habib"
branding:
  icon: "shield"
  color: "purple"

inputs:
  path:
    description: "Path to the repo/server to statically audit with mcp-doctor, relative to the checkout."
    required: false
    default: "."
  run:
    description: >
      Command that launches the MCP server over stdio, e.g. "python server.py" or
      "npx -y some-mcp-server". Required for the mcp-fuzz and mcp-reality-check runtime
      checks. If left empty, only the mcp-doctor static check runs and the runtime checks
      are skipped (reported as such, not silently dropped).
    required: false
    default: ""
  url:
    description: >
      URL of an already-running MCP server to test over Streamable HTTP, e.g.
      "https://example.com/mcp". The remote alternative to `run` for the mcp-fuzz and
      mcp-reality-check runtime checks. Set `run` or `url`, not both.
    required: false
    default: ""
  headers:
    description: >
      HTTP headers sent on every request to `url`, one KEY=VALUE per line (a value may contain
      spaces), e.g. "Authorization=Bearer <token>" (pass the token from a secret). Only used with `url`.
    required: false
    default: ""
  env:
    description: "Space-separated KEY=VALUE pairs to pass through to the launched server, e.g. \"BRAVE_API_KEY=xxx OTHER=yyy\"."
    required: false
    default: ""
  include-destructive:
    description: "Also let mcp-fuzz test tools without readOnlyHint:true. Only enable against a server you're confident is safe to call blindly (a sandbox/test backend) — see mcp-fuzz's README Safety section."
    required: false
    default: "false"
  fail-under:
    description: "Fail the workflow if the combined score percent is below this threshold. 0 disables gating."
    required: false
    default: "0"
  comment:
    description: "Post the combined report as a comment on the triggering pull request."
    required: false
    default: "true"

outputs:
  doctor-score:
    description: "mcp-doctor score percent (0-100)."
    value: ${{ steps.combine.outputs.doctor-score }}
  doctor-grade:
    description: "mcp-doctor letter grade (A-F)."
    value: ${{ steps.combine.outputs.doctor-grade }}
  fuzz-score:
    description: "mcp-fuzz crash-resilience score percent (0-100), if `run` or `url` was set."
    value: ${{ steps.combine.outputs.fuzz-score }}
  fuzz-grade:
    description: "mcp-fuzz letter grade (A-F), if `run` or `url` was set."
    value: ${{ steps.combine.outputs.fuzz-grade }}
  reality-score:
    description: "mcp-reality-check sanity score percent (0-100), if `run` or `url` was set."
    value: ${{ steps.combine.outputs.reality-score }}
  reality-grade:
    description: "mcp-reality-check letter grade (A-F), if `run` or `url` was set."
    value: ${{ steps.combine.outputs.reality-grade }}
  combined-score:
    description: "Average of whichever scores were run, percent (0-100)."
    value: ${{ steps.combine.outputs.combined-score }}
  combined-grade:
    description: "Combined letter grade (A-F)."
    value: ${{ steps.combine.outputs.combined-grade }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install the trilogy
      shell: bash
      run: pip install mcp-server-lint mcp-runtime-check mcp-reality-check

    - name: Run mcp-doctor (static)
      id: doctor
      shell: bash
      run: |
        set +e
        mcp-doctor "${{ inputs.path }}" --no-color > doctor-report.txt
        mcp-doctor "${{ inputs.path }}" --json > doctor-report.json
        set -e

    - name: Run mcp-fuzz and mcp-reality-check (runtime)
      id: runtime
      if: ${{ inputs.run != '' || inputs.url != '' }}
      shell: bash
      env:
        MCP_URL: ${{ inputs.url }}
        MCP_HEADERS: ${{ inputs.headers }}
      run: |
        if [ -n "${{ inputs.run }}" ] && [ -n "$MCP_URL" ]; then
          echo "::error::Set either 'run' (launch a local stdio server) or 'url' (connect to a running HTTP server), not both."
          exit 1
        fi

        # TARGET is what follows each tool's flags: `-- <command>` for stdio, `--url <url>` for HTTP.
        TARGET=()
        CONN_ARGS=()
        if [ -n "$MCP_URL" ]; then
          TARGET=(--url "$MCP_URL")
          while IFS= read -r header; do
            [ -n "$header" ] && CONN_ARGS+=(--header "$header")
          done <<< "$MCP_HEADERS"
        else
          read -ra RUN_CMD <<< "${{ inputs.run }}"
          TARGET=(-- "${RUN_CMD[@]}")
          for kv in ${{ inputs.env }}; do
            CONN_ARGS+=(--env "$kv")
          done
        fi
        DESTRUCTIVE_FLAG=()
        if [ "${{ inputs.include-destructive }}" = "true" ]; then
          DESTRUCTIVE_FLAG=(--include-destructive)
        fi

        set +e
        mcp-fuzz "${DESTRUCTIVE_FLAG[@]}" "${CONN_ARGS[@]}" --json "${TARGET[@]}" > fuzz-report.json
        mcp-fuzz "${DESTRUCTIVE_FLAG[@]}" "${CONN_ARGS[@]}" "${TARGET[@]}" > fuzz-report.txt
        mcp-reality-check "${CONN_ARGS[@]}" --json "${TARGET[@]}" > reality-report.json
        mcp-reality-check "${CONN_ARGS[@]}" "${TARGET[@]}" > reality-report.txt
        set -e

    - name: Combine reports
      id: combine
      shell: bash
      run: |
        python3 "${{ github.action_path }}/combine.py"

    - name: Write job summary
      shell: bash
      run: cat combined-report.md >> "$GITHUB_STEP_SUMMARY"

    - name: Comment on pull request
      if: ${{ inputs.comment == 'true' && github.event_name == 'pull_request' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh pr comment "${{ github.event.pull_request.number }}" \
          --repo "${{ github.repository }}" \
          --body-file combined-report.md \
          --edit-last || \
        gh pr comment "${{ github.event.pull_request.number }}" \
          --repo "${{ github.repository }}" \
          --body-file combined-report.md

    - name: Enforce score gate
      shell: bash
      run: |
        fail_under="${{ inputs.fail-under }}"
        combined="${{ steps.combine.outputs.combined-score }}"
        if [ "$fail_under" != "0" ] && [ "$(python3 -c "print(1 if $combined < $fail_under else 0)")" = "1" ]; then
          echo "::error::mcp-trust-check combined score $combined% is below the required $fail_under%"
          exit 1
        fi
